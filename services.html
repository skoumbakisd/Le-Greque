document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 body { margin: 0; background: #fefdf9; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #0a4d5c; text-decoration: none; transition: color .3s ease; }\n  a:hover { color: #b8894f; }\n  ::selection { background: #d4a574; color: #0a4d5c; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Jost', system-ui, sans-serif; color: #1a3a52; background: #fefdf9; overflow-x: hidden;\">\n\n  <nav style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 20px clamp(24px, 5vw, 72px); background: rgba(254, 253, 249, 0.86); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(10, 77, 92, 0.08);\">\n    <a href=\"index.html\" style=\"display: flex; flex-direction: column; gap: 2px; line-height: 1;\">\n      <span style=\"font-family: 'Playfair Display', serif; font-size: 20px; letter-spacing: 0.14em; color: #0a4d5c;\">LE GRECQUE<\u002Fspan>\n      <span style=\"font-size: 9px; letter-spacing: 0.34em; color: #8b9e8f; text-transform: uppercase;\">Luxury Services · Chania<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display: flex; align-items: center; gap: clamp(18px, 3vw, 40px);\">\n      <a href=\"services.html\" style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #b8894f;\">Services<\u002Fa>\n      <a href=\"about.html\" style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #1a3a52;\" style-hover=\"color: #b8894f;\">About<\u002Fa>\n      <a href=\"{{ whatsappHref }}\" target=\"_blank\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border: 1px solid #0a4d5c; border-radius: 999px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #0a4d5c; transition: all .35s ease;\" style-hover=\"background: #0a4d5c; color: #f5f1e8; box-shadow: 0 8px 30px rgba(10,77,92,0.24);\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #8b9e8f; box-shadow: 0 0 0 3px rgba(139,158,143,0.25);\"><\u002Fspan>WhatsApp\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <header style=\"position: relative; padding: clamp(150px, 20vh, 220px) clamp(24px, 5vw, 72px) clamp(60px, 8vw, 100px); background: #f5f1e8; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; opacity: 0.05; background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2772%27 height=%2772%27%3E%3Cpath d=%27M10 62V10h52v42H24V24h28v18H36%27 fill=%27none%27 stroke=%27%230a4d5c%27 stroke-width=%271.5%27/%3E%3C/svg%3E'); background-size: 72px 72px;\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 1280px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 22px;\">\n        <span style=\"width: 46px; height: 1px; background: #d4a574;\"><\u002Fspan>\n        <span style=\"font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase; color: #8b9e8f;\">Services<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(40px, 6.4vw, 88px); line-height: 1.02; letter-spacing: -0.02em; margin: 0; color: #0a4d5c;\">Everything, arranged<br><span style=\"font-style: italic; color: #b8894f;\">before you ask twice<\u002Fspan><\u002Fh1>\n      <p style=\"margin: 30px 0 0; max-width: 54ch; font-size: clamp(15px, 1.2vw, 17px); font-weight: 300; line-height: 1.85; color: #4a6572; text-wrap: pretty;\">There is no menu to choose from and nothing to book in advance. Message her with the day you want, and it is assembled around your party, the weather, and what is actually good that week.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section data-reveal=\"\" style=\"padding: clamp(70px, 9vw, 120px) clamp(24px, 5vw, 72px); background: #fefdf9;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 1px; background: rgba(10,77,92,0.12);\">\n\n      <div style=\"background: #fefdf9; padding: clamp(38px, 5vw, 64px) 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: clamp(24px, 5vw, 72px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: #b8894f;\">01<\u002Fspan>\n          <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.1; margin: 0; color: #0a4d5c;\">Dining<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572; max-width: 32ch;\">Reservations held, not requested. In peak weeks this is the single thing guests use her for most.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 40px; align-content: start;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Old port tables<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Waterfront and Venetian harbour, at the hour you want rather than the hour offered.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Private chef<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Dinner at the villa, market-led, from a quiet supper to a table of twenty.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Mountain tavernas<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">The places inland that do not take bookings, arranged by phone call and reputation.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Celebrations<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Anniversaries, proposals, rehearsal dinners. Flowers, cake, music, and discretion.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fefdf9; padding: clamp(38px, 5vw, 64px) 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: clamp(24px, 5vw, 72px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: #b8894f;\">02<\u002Fspan>\n          <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.1; margin: 0; color: #0a4d5c;\">On the water<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572; max-width: 32ch;\">Boats matched to the party and the forecast, with departure times set to miss the crowds rather than the operator's schedule.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 40px; align-content: start;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Balos and Gramvousa<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Private departure from Kissamos, in the lagoon before the day ferries arrive.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Falassarna coast<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Reefs, sea caves, and afternoon anchorages on the western shore.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Yacht charter<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Day and multi-day, skippered, with catering and berth coordination handled.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Diving and instruction<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Certified guides for open water, and patient ones for children's first lessons.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fefdf9; padding: clamp(38px, 5vw, 64px) 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: clamp(24px, 5vw, 72px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: #b8894f;\">03<\u002Fspan>\n          <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.1; margin: 0; color: #0a4d5c;\">Inland<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572; max-width: 32ch;\">The half of Crete that is not coastline: gorges, vineyards, and villages an hour behind the sea.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 40px; align-content: start;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Manousakis winery<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Vatolakkos, tasting the Nostos labels with the family, long lunch under the vines.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Samaria gorge<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Guided descent, early start, boat and transfer out of Agia Roumeli arranged.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Olive groves<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Mill visits and tastings, and the harvest itself if you are here in autumn.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Old town, privately<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Venetian and Ottoman Chania with a historian, before the streets fill.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fefdf9; padding: clamp(38px, 5vw, 64px) 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: clamp(24px, 5vw, 72px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: #b8894f;\">04<\u002Fspan>\n          <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.1; margin: 0; color: #0a4d5c;\">Stay and transfers<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572; max-width: 32ch;\">Where you sleep and how you move, held together by one person who knows both.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 40px; align-content: start;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Villas at Falassarna<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Private houses on the western headland, most never listed publicly.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Villa staffing<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Housekeeping, chef, childcare, and a stocked kitchen on the day you land.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Airport and port<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">Met by name at Chania or Heraklion, luggage handled, cold water in the car.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(212,165,116,0.5);\">\n            <span style=\"font-size: 15px; color: #0a4d5c;\">Drivers on call<\u002Fspan>\n            <span style=\"font-size: 13px; font-weight: 300; line-height: 1.7; color: #4a6572;\">A car and driver for the week, plus helicopter and private aviation when needed.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-reveal=\"\" style=\"padding: clamp(70px, 9vw, 120px) clamp(24px, 5vw, 72px); background: #f0f4f8;\">\n    <div style=\"max-width: 1080px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 44px;\">\n        <span style=\"width: 34px; height: 1px; background: #d4a574;\"><\u002Fspan>\n        <span style=\"font-size: 10px; letter-spacing: 0.38em; text-transform: uppercase; color: #8b9e8f;\">How it works<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(28px, 4vw, 56px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"font-family: 'Playfair Display', serif; font-size: 38px; color: rgba(10,77,92,0.2);\">I<\u002Fspan>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px; margin: 0; color: #0a4d5c;\">You message<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572;\">WhatsApp, at any hour. A sentence is enough: six of us, Thursday, something on the water.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"font-family: 'Playfair Display', serif; font-size: 38px; color: rgba(10,77,92,0.2);\">II<\u002Fspan>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px; margin: 0; color: #0a4d5c;\">She proposes one thing<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572;\">Not a list. One plan, with the timing and the reason behind it, usually within the hour.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"font-family: 'Playfair Display', serif; font-size: 38px; color: rgba(10,77,92,0.2);\">III<\u002Fspan>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px; margin: 0; color: #0a4d5c;\">It is arranged<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572;\">Bookings, transfers, and the people at the other end. You are told when and where, nothing more.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"font-family: 'Playfair Display', serif; font-size: 38px; color: rgba(10,77,92,0.2);\">IV<\u002Fspan>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px; margin: 0; color: #0a4d5c;\">She stays reachable<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.8; color: #4a6572;\">Weather turns, plans change, someone oversleeps. The day gets rebuilt without a conversation about it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-reveal=\"\" style=\"position: relative; padding: clamp(80px, 10vw, 130px) clamp(24px, 5vw, 72px); background: linear-gradient(155deg, #0a4d5c 0%, #1a3a52 60%, #123a46 100%); overflow: hidden; text-align: center;\">\n    <div style=\"position: absolute; top: -25%; left: 50%; width: 60vw; height: 60vw; transform: translateX(-50%); background: radial-gradient(circle, rgba(232,184,107,0.2) 0%, rgba(232,184,107,0) 66%);\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(30px, 4vw, 52px); line-height: 1.08; margin: 0; color: #fefdf9; text-shadow: 0 0 60px rgba(240,244,248,0.2);\">Tell her what the day should feel like.<\u002Fh2>\n      <p style=\"margin: 22px auto 38px; max-width: 44ch; font-size: 15px; font-weight: 300; line-height: 1.85; color: rgba(245,241,232,0.78);\">She will handle the part that involves phone calls.<\u002Fp>\n      <div style=\"display: flex; justify-content: center; flex-wrap: wrap; gap: 14px;\">\n        <a href=\"{{ whatsappHref }}\" target=\"_blank\" style=\"padding: 17px 34px; border-radius: 999px; background: #d4a574; color: #0a3a46; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; transition: all .4s ease; box-shadow: 0 10px 40px rgba(212,165,116,0.34);\" style-hover=\"background: #e8b86b; box-shadow: 0 16px 56px rgba(232,184,107,0.5); transform: translateY(-2px);\">Message on WhatsApp<\u002Fa>\n        <a href=\"index.html#plan\" style=\"padding: 17px 34px; border-radius: 999px; border: 1px solid rgba(245,241,232,0.5); color: #f5f1e8; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; transition: all .4s ease;\" style-hover=\"background: rgba(245,241,232,0.12); border-color: #f5f1e8;\">Send an enquiry<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: #0a3a46; padding: 0 clamp(24px, 5vw, 72px) 40px;\">\n    <div style=\"height: 3px; background-image: url('data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2740%27 height=%273%27%3E%3Cpath d=%27M0 1.5h10M14 1.5h4M22 1.5h4M30 1.5h10%27 stroke=%27%23d4a574%27 stroke-width=%272%27/%3E%3C/svg%3E'); background-size: 40px 3px; opacity: 0.5;\"><\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 24px; padding: 48px 0 36px;\">\n      <a href=\"index.html\" style=\"font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: 0.14em; color: #f5f1e8;\">LE GRECQUE<\u002Fa>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 28px;\">\n        <a href=\"index.html\" style=\"font-size: 13px; font-weight: 300; color: rgba(245,241,232,0.78);\" style-hover=\"color: #d4a574;\">Home<\u002Fa>\n        <a href=\"about.html\" style=\"font-size: 13px; font-weight: 300; color: rgba(245,241,232,0.78);\" style-hover=\"color: #d4a574;\">About<\u002Fa>\n        <a href=\"{{ emailHref }}\" style=\"font-size: 13px; font-weight: 300; color: rgba(245,241,232,0.78);\" style-hover=\"color: #d4a574;\">hello@legrecque.gr<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top: 24px; border-top: 1px solid rgba(245,241,232,0.1); font-size: 11px; font-weight: 300; letter-spacing: 0.08em; color: rgba(245,241,232,0.4);\">© 2026 Le Grecque Luxury Services · Chania, Crete<\u002Fdiv>\n  <\u002Ffooter>\n\n  <a href=\"{{ whatsappHref }}\" target=\"_blank\" style=\"position: fixed; right: clamp(18px, 3vw, 34px); bottom: clamp(18px, 3vw, 34px); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 15px 24px; border-radius: 999px; background: #0a4d5c; color: #f5f1e8; box-shadow: 0 14px 44px rgba(10,58,70,0.34); transition: all .4s ease;\" style-hover=\"background: #d4a574; color: #0a3a46; transform: translateY(-2px);\">\n    <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #8fbf9f; box-shadow: 0 0 10px rgba(143,191,159,0.9);\"><\u002Fspan>\n    <span style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;\">Message her<\u002Fspan>\n  <\u002Fa>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;306940000000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hello@legrecque.gr&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(26px)'; el.style.transition = 'opacity 1s cubic-bezier(.2,.7,.3,1), transform 1s cubic-bezier(.2,.7,.3,1)'; });\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } });\n    }, { threshold: 0.06, rootMargin: '0px 0px -6% 0px' });\n    els.forEach(el => io.observe(el));\n    this._io = io;\n    const revealAll = () => els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n    const de = document.documentElement;\n    if (!('IntersectionObserver' in window) || de.scrollHeight <= de.clientHeight + 4) revealAll();\n    this._t = setTimeout(() => { if ((window.scrollY || de.scrollTop || 0) === 0) revealAll(); }, 2200);\n  }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); }\n  renderVals() {\n    const num = this.props.whatsappNumber ?? '306940000000';\n    const email = this.props.email ?? 'hello@legrecque.gr';\n    return { whatsappHref: 'https://wa.me/' + String(num).replace(/[^0-9]/g, ''), emailHref: 'mailto:' + email };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
